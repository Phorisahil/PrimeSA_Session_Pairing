services:
  - type: web
    name: primesa-pairing
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_DIR
        value: /var/data/sessions
    disk:
      name: primesa-sessions
      mountPath: /var/data
      sizeGB: 1
